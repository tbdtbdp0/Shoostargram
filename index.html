<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슈스타그램 메이커</title>
<style>
    body { background-color: #f4f5f7; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    .control-panel { width: 450px; background: #fff; padding: 30px; box-shadow: 2px 0 15px rgba(0,0,0,0.08); overflow-y: auto; z-index: 10; }
    .preview-panel { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #1a1a1a; position: relative; }
    h1 { font-size: 22px; margin-bottom: 20px; color: #111; font-weight: 800; letter-spacing: -0.5px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 30px 0 12px; border-bottom: 2px solid #111; padding-bottom: 6px; color: #111; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 600; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 13px; background: #fafafa; transition: 0.2s; }
    .input-group input[type="file"] { padding: 7px; background: #fff; cursor: pointer; }
    .input-group input[type="checkbox"] { width: auto; transform: scale(1.2); margin-right: 8px; cursor: pointer; }
    .input-group input:focus, .input-group textarea:focus { border-color: #000; outline: none; background: #fff; }
    .input-row { display: flex; gap: 10px; }
    .input-row .input-group { flex: 1; }
    button { background: #0095f6; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; margin-bottom: 8px; }
    button:hover { background: #0077c2; }
    .btn-secondary { background: #efefef; color: #111; }
    .btn-secondary:hover { background: #dbdbdb; }
    .btn-success { background: #28a745; margin-top: 20px; font-size: 16px; padding: 15px; }
    .manage-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #f8f9fa; border: 1px solid #eee; border-radius: 8px; font-size: 12px; }
    .manage-item img { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; margin-right: 10px; }
    .manage-item-info { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; font-weight: 500; }
    .manage-actions { display: flex; gap: 5px; }
    .manage-actions button { width: auto; padding: 6px 10px; margin: 0; font-size: 11px; border-radius: 5px; }
    .btn-edit { background: #fff; color: #0095f6; border: 1px solid #0095f6; }
    .btn-delete { background: #fff; color: #ed4956; border: 1px solid #ed4956; }
    #code-output-area { display: none; margin-top: 20px; }
    #final-code { width: 100%; height: 150px; padding: 10px; font-family: monospace; font-size: 11px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; box-sizing: border-box; }
    * { box-sizing: border-box; }
    .phone-frame { width: 390px; height: 844px; background: #000; border-radius: 55px; box-shadow: 0 0 60px rgba(0,0,0,0.6); border: 8px solid #333; position: relative; overflow: hidden; transform: scale(0.85); }
    .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 100; }
    .screen-area { width: 100%; height: 100%; background: #fff; border-radius: 48px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status-bar { height: 54px; display: flex; justify-content: flex-end; padding: 14px 26px 0; font-size: 15px; font-weight: 600; z-index: 90; letter-spacing: -0.5px; }
    .app-header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; z-index: 80; border-bottom: 0.5px solid #dbdbdb; }
    .username { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 4px; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 20px; }
    .content-container { flex: 1; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; padding-bottom: 60px; background: #fff; }
    .content-container::-webkit-scrollbar { display: none; }
    #page-profile { display: block; }
    .profile-info { padding: 12px 20px 0; display: flex; align-items: center; justify-content: space-between; }
    .profile-img-wrap { position: relative; width: 86px; height: 86px; border-radius: 50%; padding: 3px; background: #dbdbdb; }
    .profile-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background-color: #eee; }
    .my-story-badge { position: absolute; bottom: 0; right: 0; width: 24px; height: 24px; background: #0095f6; border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: bold; line-height: 1; z-index: 2; }
    .stats-group { display: flex; gap: 24px; text-align: center; margin-right: 10px; }
    .stat-num { display: block; font-weight: 700; font-size: 17px; }
    .stat-label { font-size: 13px; color: #262626; margin-top: -2px; }
    .bio-area { padding: 12px 20px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; color: #262626; }
    .action-btns { padding: 0 16px 15px; display: flex; gap: 8px; }
    .btn-profile { flex: 1; background: #efefef; color: #000; border: none; border-radius: 8px; padding: 7px; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
    .highlights { display: flex; gap: 15px; padding: 5px 16px 15px; overflow-x: auto; border-bottom: 0.5px solid #dbdbdb; }
    .highlights::-webkit-scrollbar { display: none; }
    .highlight-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
    .hl-circle { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 3px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .hl-inner { width: 100%; height: 100%; background: #f0f0f0; border-radius: 50%; overflow: hidden; border: 1px solid #efefef; }
    .hl-inner img { width: 100%; height: 100%; object-fit: cover; }
    .hl-title { font-size: 12px; color: #262626; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid-tabs { display: flex; height: 44px; }
    .grid-tab { flex: 1; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .grid-tab.active { border-bottom: 1px solid #262626; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; } 
    .grid-cell { position: relative; padding-bottom: 100%; background: #eee; cursor: pointer; overflow: hidden; }
    .grid-cell img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
    #page-home { display: none; padding-top: 0; }
    .home-header { position: sticky; top: 0; background: #fff; z-index: 80; border-bottom: 0.5px solid #dbdbdb; }
    .app-logo { font-family: 'Brush Script MT', 'Apple Chancery', 'Snell Roundhand', cursive; font-size: 26px; font-weight: 500; margin-top: 4px; color: #000; letter-spacing: -0.5px; }
    .story-container { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 0.5px solid #dbdbdb; overflow-x: auto; }
    .story-container::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 66px; cursor: pointer; }
    .story-ring { width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; position: relative; }
    .story-ring.active { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .story-ring.empty { background: transparent; }
    .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #fff; object-fit: cover; background: #fff; }
    .story-name { font-size: 11px; color: #262626; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-post { margin-bottom: 15px; border-bottom: 0.5px solid #dbdbdb; padding-bottom: 15px; }
    .feed-header { display: flex; align-items: center; padding: 10px 14px; justify-content: space-between; }
    .feed-user { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
    .feed-user-ring { width: 36px; height: 36px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #bc1888); }
    .feed-user-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1.5px solid #fff; }
    .feed-main-img { width: 100%; display: block; aspect-ratio: 4/5; object-fit: cover; background: #eee; }
    .feed-actions { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: center; }
    .action-left { display: flex; gap: 16px; align-items: center; }
    .feed-likes { padding: 0 14px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .feed-caption { padding: 0 14px; font-size: 14px; line-height: 1.4; color: #262626; }
    .feed-caption span { font-weight: 600; margin-right: 6px; color: #000; }
    .feed-date { padding: 0 14px; font-size: 11px; color: #737373; margin-top: 6px; text-transform: uppercase; }
    .post-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 200; display: none; flex-direction: column; animation: slideUp 0.2s ease-out; }
    .post-modal.show { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { padding: 0 16px; height: 44px; display: flex; align-items: center; border-bottom: 1px solid #dbdbdb; font-weight: 600; font-size: 16px; }
    .modal-back-btn { background: none; border: none; padding: 0; margin-right: 15px; cursor: pointer; }
    .modal-scroll { flex: 1; overflow-y: auto; padding-bottom: 20px; }
    .modal-scroll::-webkit-scrollbar { display: none; }
    .bottom-nav { height: 50px; background: #fff; border-top: 0.5px solid #dbdbdb; display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; width: 100%; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 15px); }
    .nav-item { cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; }
    .my-profile-icon { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; border: 1px solid #dbdbdb; transition: border 0.1s; }
    .my-profile-icon.active { border: 2px solid #262626; }
    .my-profile-icon img { width: 100%; height: 100%; object-fit: cover; }
    .icon { fill: none; stroke: #262626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="control-panel">
    <h1>✨ 슈스타그램 메이커</h1>
    
    <div class="section-title">1. 프로필 정보</div>
    <div class="input-group">
        <label>아이디</label>
        <input type="text" id="inp-username" value="아이디">
    </div>
    <div class="input-group">
        <label>프로필 사진 (파일 선택)</label>
        <input type="file" id="inp-profile-file" accept="image/*">
        <input type="hidden" id="hidden-profile-pic" value="https://via.placeholder.com/150">
    </div>
    <div class="input-group">
        <label>소개글</label>
        <textarea id="inp-bio" rows="3">소개글을 입력하세요</textarea>
    </div>
    <div class="input-row">
        <div class="input-group"><label>팔로워</label><input type="text" id="inp-followers" value="0"></div>
        <div class="input-group"><label>팔로잉</label><input type="text" id="inp-following" value="0"></div>
    </div>
    <div class="input-group" style="display: flex; align-items: center;">
        <input type="checkbox" id="inp-private" checked>
        <label for="inp-private" style="margin: 0; font-size: 13px; cursor: pointer;">비공개 계정 (자물쇠 표시)</label>
    </div>
    <button id="btn-update-profile" class="btn-secondary">프로필 적용하기</button>

    <div class="section-title">2. 항목 추가하기</div>
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
        <div class="input-group">
            <label>유형 선택</label>
            <select id="inp-type">
                <option value="post">피드 게시물</option>
                <option value="story">스토리</option>
                <option value="highlight">하이라이트</option>
            </select>
        </div>
        <div class="input-group">
            <label>사진 업로드</label>
            <input type="file" id="inp-item-file" accept="image/*">
            <input type="hidden" id="hidden-item-pic">
            <div id="edit-img-notice" style="display:none; color:#0095f6; font-size:11px; margin-top:4px;">* 이미지가 저장되어 있습니다. 변경하려면 새로 업로드하세요.</div>
        </div>
        <div class="input-group" id="wrap-text1">
            <label id="label-text1">내용 (캡션)</label>
            <textarea id="inp-item-text1" rows="2" placeholder="문구를 입력하세요..."></textarea>
        </div>
        <div class="input-row" id="wrap-text2">
            <div class="input-group"><label>작성일</label><input type="text" id="inp-item-date" value="방금 전"></div>
            <div class="input-group"><label>좋아요 수</label><input type="text" id="inp-item-like" value="0개"></div>
        </div>
        <button id="btn-add-item">추가</button>
    </div>

    <div class="section-title">3. 추가된 항목 관리</div>
    <div style="font-size:11px; color:#888; margin-bottom:10px;">수정을 원하시면 '수정'을 눌러 위 입력창으로 불러온 뒤 다시 추가하세요.</div>
    <div id="manage-list-container" class="manage-list"></div>

    <div class="section-title">4. 최종 완성</div>
    <button id="btn-generate-code" class="btn-success">최종 코드 추출하기</button>
    
    <div id="code-output-area">
        <textarea id="final-code" readonly></textarea>
        <button id="btn-copy-code" class="btn-secondary" style="margin-top: 5px;">복사하기</button>
    </div>
</div>

<div class="preview-panel">
    <div class="phone-frame" id="export-target">
        <div class="dynamic-island"></div>
        <div class="screen-area">
            
            <div class="status-bar">
                <div style="display: flex; gap: 6px;">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M14 0H4C1.79086 0 0 1.79086 0 4V8C0 10.2091 1.79086 12 4 12H14C16.2091 12 18 10.2091 18 8V4C18 1.79086 16.2091 0 14 0Z"/></svg>
                </div>
            </div>

            <div id="page-profile" class="content-container">
                <header class="app-header">
                    <div class="username"><svg id="lock-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px; margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span class="global-username">아이디</span></div>
                    <div class="header-actions">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M12 7v10M7 12h10"></path></svg>
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                </header>

                <section class="profile-info">
                    <div class="profile-img-wrap">
                        <img src="https://via.placeholder.com/150" class="profile-img global-profile-pic">
                        <div class="my-story-badge">+</div>
                    </div>
                    <div class="stats-group">
                        <div class="stat-item"><span class="stat-num" id="display-post-count">0</span><span class="stat-label">게시물</span></div>
                        <div class="stat-item"><span class="stat-num" id="display-followers">0</span><span class="stat-label">팔로워</span></div>
                        <div class="stat-item"><span class="stat-num" id="display-following">0</span><span class="stat-label">팔로잉</span></div>
                    </div>
                </section>
                
                <section class="bio-area" id="display-bio">소개글을 입력하세요</section>
                
                <section class="action-btns">
                    <div class="btn-profile">프로필 편집</div>
                    <div class="btn-profile">프로필 공유</div>
                </section>

                <section class="highlights" id="display-highlights">
                </section>

                <div class="grid-tabs">
                    <div class="grid-tab active"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" stroke="none" fill="#262626"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="#262626" stroke-width="2" fill="none"></rect><line x1="3" y1="9" x2="21" y2="9" stroke="#262626" stroke-width="2"></line><line x1="9" y1="21" x2="9" y2="9" stroke="#262626" stroke-width="2"></line></svg></div>
                    <div class="grid-tab"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" stroke="#8e8e8e"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="M15 5l4 4"></path></svg></div>
                    <div class="grid-tab"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" stroke="#8e8e8e"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></div>
                </div>

                <div class="photo-grid" id="display-grid">
                </div>
            </div>

            <div id="page-home" class="content-container">
                <header class="app-header home-header">
                    <div class="app-logo">Shoostargram</div>
                    <div class="header-actions">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </div>
                </header>

                <div class="story-container" id="display-stories">
                    <div class="story-item" id="my-story-btn">
                        <div class="story-ring empty">
                            <img src="https://via.placeholder.com/150" class="global-profile-pic">
                            <div class="my-story-badge" style="width:20px; height:20px; font-size:14px; bottom:-2px; right:-2px;">+</div>
                        </div>
                        <span class="story-name" style="color:#737373;">내 스토리</span>
                    </div>
                </div>

                <div id="display-feed">
                </div>
                <div style="text-align:center; padding: 30px; color:#8e8e8e; font-size:12px;">모든 게시물을 확인했습니다</div>
            </div>

            <div class="post-modal" id="postModal">
                <div class="modal-header">
                    <button class="modal-back-btn" onclick="closeModal()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <div style="font-size: 14px; font-weight:700; text-transform:uppercase; color:#262626;">게시물</div>
                </div>
                <div class="modal-scroll" id="modal-feed-content">
                </div>
            </div>

            <nav class="bottom-nav">
                <div class="nav-item" onclick="switchTab('home')">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2" id="icon-home"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <div class="nav-item"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
                <div class="nav-item"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></div>
                <div class="nav-item"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></div>
                <div class="nav-item" onclick="switchTab('profile')">
                    <div class="my-profile-icon active" id="icon-profile-wrap"><img src="https://via.placeholder.com/150" class="global-profile-pic"></div>
                </div>
            </nav>
        </div>
    </div>
</div>

<script>
    let state = { posts: [], stories: [], highlights: [] };

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('btn-update-profile').addEventListener('click', async () => {
        const username = document.getElementById('inp-username').value;
        const fileInput = document.getElementById('inp-profile-file');
        const isPrivate = document.getElementById('inp-private').checked;
        
        if (fileInput.files.length > 0) {
            const base64Str = await getBase64(fileInput.files[0]);
            document.getElementById('hidden-profile-pic').value = base64Str;
        }
        
        const profilePic = document.getElementById('hidden-profile-pic').value;
        
        document.querySelectorAll('.global-username').forEach(el => el.innerText = username);
        document.querySelectorAll('.global-profile-pic').forEach(el => el.src = profilePic);
        document.getElementById('display-bio').innerText = document.getElementById('inp-bio').value;
        document.getElementById('display-followers').innerText = document.getElementById('inp-followers').value;
        document.getElementById('display-following').innerText = document.getElementById('inp-following').value;
        document.getElementById('lock-icon').style.display = isPrivate ? 'block' : 'none';
        
        renderAll(); 
    });

    document.getElementById('inp-type').addEventListener('change', (e) => {
        const type = e.target.value;
        const wrapText2 = document.getElementById('wrap-text2');
        const labelText1 = document.getElementById('label-text1');
        
        if(type === 'post') {
            wrapText2.style.display = 'flex';
            labelText1.innerText = '내용 (캡션)';
        } else {
            wrapText2.style.display = 'none';
            labelText1.innerText = type === 'story' ? '스토리 이름 (선택)' : '하이라이트 이름 (선택)';
        }
    });

    document.getElementById('btn-add-item').addEventListener('click', async () => {
        const type = document.getElementById('inp-type').value;
        const fileInput = document.getElementById('inp-item-file');
        let pic = document.getElementById('hidden-item-pic').value;
        
        if (fileInput.files.length > 0) {
            pic = await getBase64(fileInput.files[0]);
        }
        
        if(!pic) return alert('이미지를 업로드 해주세요!');

        const text1 = document.getElementById('inp-item-text1').value;
        const newItem = { id: Date.now().toString(), pic, text: text1 };

        if(type === 'post') {
            newItem.date = document.getElementById('inp-item-date').value;
            newItem.like = document.getElementById('inp-item-like').value;
            state.posts.unshift(newItem); 
        } else if(type === 'story') {
            state.stories.push(newItem);
        } else if(type === 'highlight') {
            state.highlights.push(newItem);
        }

        fileInput.value = '';
        document.getElementById('hidden-item-pic').value = '';
        document.getElementById('inp-item-text1').value = '';
        document.getElementById('edit-img-notice').style.display = 'none';
        
        renderAll();
    });

    window.deleteItem = function(type, id) {
        state[type] = state[type].filter(item => item.id !== id);
        renderAll();
    }

    window.editItem = function(type, id) {
        const item = state[type].find(item => item.id === id);
        if(!item) return;

        document.getElementById('inp-type').value = type === 'posts' ? 'post' : type === 'stories' ? 'story' : 'highlight';
        document.getElementById('inp-type').dispatchEvent(new Event('change')); 
        
        document.getElementById('inp-item-file').value = '';
        document.getElementById('hidden-item-pic').value = item.pic;
        document.getElementById('edit-img-notice').style.display = 'block'; 
        
        document.getElementById('inp-item-text1').value = item.text;
        
        if(type === 'posts') {
            document.getElementById('inp-item-date').value = item.date;
            document.getElementById('inp-item-like').value = item.like;
        }

        deleteItem(type, id); 
    }

    function renderAll() {
        const username = document.getElementById('inp-username').value;
        const profilePic = document.getElementById('hidden-profile-pic').value;
        
        const feedContainer = document.getElementById('display-feed');
        const gridContainer = document.getElementById('display-grid');
        feedContainer.innerHTML = ''; gridContainer.innerHTML = '';
        
        state.posts.forEach(post => {
            const feedHTML = `
                <article class="feed-post" id="post-${post.id}">
                    <div class="feed-header">
                        <div class="feed-user"><div class="feed-user-ring"><img src="${profilePic}" class="feed-user-img"></div><span style="color:#262626;">${username}</span></div>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                    </div>
                    <img src="${post.pic}" class="feed-main-img">
                    <div class="feed-actions">
                        <div class="action-left">
                            <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </div>
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <div class="feed-likes">좋아요 ${post.like}</div>
                    <div class="feed-caption"><span>${username}</span>${post.text}</div>
                    <div class="feed-date">${post.date}</div>
                </article>`;
            feedContainer.insertAdjacentHTML('beforeend', feedHTML);
            
            const gridHTML = `<div class="grid-cell" onclick="openModal('post-${post.id}')"><img src="${post.pic}"></div>`;
            gridContainer.insertAdjacentHTML('beforeend', gridHTML);
        });
        document.getElementById('display-post-count').innerText = state.posts.length;

        const storyContainer = document.getElementById('display-stories');
        Array.from(storyContainer.children).forEach(child => { if(child.id !== 'my-story-btn') child.remove(); });
        state.stories.forEach(story => {
            const storyHTML = `
                <div class="story-item">
                    <div class="story-ring active"><img src="${story.pic}"></div>
                    <span class="story-name">${story.text || '스토리'}</span>
                </div>`;
            storyContainer.insertAdjacentHTML('beforeend', storyHTML);
        });

        const hlContainer = document.getElementById('display-highlights');
        hlContainer.innerHTML = '';
        state.highlights.forEach(hl => {
            const hlHTML = `
                <div class="highlight-item">
                    <div class="hl-circle"><div class="hl-inner"><img src="${hl.pic}"></div></div>
                    <span class="hl-title">${hl.text || '새로운'}</span>
                </div>`;
            hlContainer.insertAdjacentHTML('beforeend', hlHTML);
        });

        const manageContainer = document.getElementById('manage-list-container');
        manageContainer.innerHTML = '';
        const types = [
            { key: 'posts', label: '게시물' },
            { key: 'stories', label: '스토리' },
            { key: 'highlights', label: '하이라이트' }
        ];

        types.forEach(t => {
            state[t.key].forEach(item => {
                const titleText = item.text ? item.text : '(내용 없음)';
                const listHTML = `
                    <div class="manage-item">
                        <div style="display:flex; align-items:center; flex:1; overflow:hidden;">
                            <img src="${item.pic}">
                            <div class="manage-item-info">[${t.label}] ${titleText}</div>
                        </div>
                        <div class="manage-actions">
                            <button class="btn-edit" onclick="editItem('${t.key}', '${item.id}')">수정</button>
                            <button class="btn-delete" onclick="deleteItem('${t.key}', '${item.id}')">삭제</button>
                        </div>
                    </div>`;
                manageContainer.insertAdjacentHTML('beforeend', listHTML);
            });
        });
    }

    window.switchTab = function(tab) {
        if(tab === 'home') {
            document.getElementById('page-profile').style.display = 'none';
            document.getElementById('page-home').style.display = 'block';
            document.getElementById('icon-home').setAttribute('fill', '#262626');
            document.getElementById('icon-home').setAttribute('stroke', 'none');
            document.getElementById('icon-profile-wrap').classList.remove('active');
        } else {
            document.getElementById('page-home').style.display = 'none';
            document.getElementById('page-profile').style.display = 'block';
            document.getElementById('icon-home').setAttribute('fill', 'none');
            document.getElementById('icon-home').setAttribute('stroke', 'currentColor');
            document.getElementById('icon-profile-wrap').classList.add('active');
        }
    }

    window.openModal = function(postId) {
        const postElement = document.getElementById(postId);
        if(!postElement) return;
        document.getElementById('modal-feed-content').innerHTML = postElement.outerHTML;
        document.getElementById('postModal').classList.add('show');
    }

    window.closeModal = function() {
        document.getElementById('postModal').classList.remove('show');
        document.getElementById('modal-feed-content').innerHTML = '';
    }

    document.getElementById('btn-generate-code').addEventListener('click', () => {
        const phoneHTML = document.getElementById('export-target').outerHTML;
        const styles = document.querySelector('style').innerHTML;

        const finalOutput = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shoostargram</title>
<style>
    body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: auto; }
    ${styles}
    .control-panel, #code-output-area { display: none !important; }
    .phone-frame { transform: scale(1); margin: 20px auto; } 
</style>
</head>
<body>
    ${phoneHTML}
    <script>
        function switchTab(tab) {
            if(tab === 'home') {
                document.getElementById('page-profile').style.display = 'none';
                document.getElementById('page-home').style.display = 'block';
                document.getElementById('icon-home').setAttribute('fill', '#262626');
                document.getElementById('icon-home').setAttribute('stroke', 'none');
                document.getElementById('icon-profile-wrap').classList.remove('active');
            } else {
                document.getElementById('page-home').style.display = 'none';
                document.getElementById('page-profile').style.display = 'block';
                document.getElementById('icon-home').setAttribute('fill', 'none');
                document.getElementById('icon-home').setAttribute('stroke', 'currentColor');
                document.getElementById('icon-profile-wrap').classList.add('active');
            }
        }
        function openModal(postId) {
            const postElement = document.getElementById(postId);
            if(!postElement) return;
            document.getElementById('modal-feed-content').innerHTML = postElement.outerHTML;
            document.getElementById('postModal').classList.add('show');
        }
        function closeModal() {
            document.getElementById('postModal').classList.remove('show');
            document.getElementById('modal-feed-content').innerHTML = '';
        }
    <\/script>
</body>
</html>`;

        const outArea = document.getElementById('code-output-area');
        document.getElementById('final-code').value = finalOutput;
        outArea.style.display = 'block';
        outArea.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btn-copy-code').addEventListener('click', () => {
        const copyText = document.getElementById('final-code');
        copyText.select();
        document.execCommand('copy');
        alert("코드가 복사되었습니다. html 뷰어 등을 통해 감상하세요!");
    });
</script>

</body>
</html>
